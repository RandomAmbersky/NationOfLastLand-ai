# Nation of Last Land - Upgrade Configuration

# Unit upgrade configurations
unit_upgrades:
  # Health upgrades
  health_upgrade_t1:
    name: "Basic Armor Reinforcement"
    category: "health"
    tier: 1
    description: "Increases vehicle health by 25%"
    effects:
      - type: "health_multiplier"
        value: 1.25
    cost:
      reputation: 100
    prerequisites: []

  health_upgrade_t2:
    name: "Advanced Armor Plating"
    category: "health"
    tier: 2
    description: "Increases vehicle health by 50%"
    effects:
      - type: "health_multiplier"
        value: 1.5
    cost:
      reputation: 250
    prerequisites:
      - "health_upgrade_t1"

  health_upgrade_t3:
    name: "Elite Armor Systems"
    category: "health"
    tier: 3
    description: "Increases vehicle health by 75%"
    effects:
      - type: "health_multiplier"
        value: 1.75
    cost:
      reputation: 500
      gold: 10
    prerequisites:
      - "health_upgrade_t2"

  # Speed upgrades
  speed_upgrade_t1:
    name: "Engine Tuning"
    category: "speed"
    tier: 1
    description: "Increases movement speed by 20%"
    effects:
      - type: "speed_multiplier"
        value: 1.2
    cost:
      reputation: 80
    prerequisites: []

  speed_upgrade_t2:
    name: "Performance Engine"
    category: "speed"
    tier: 2
    description: "Increases movement speed by 40%"
    effects:
      - type: "speed_multiplier"
        value: 1.4
    cost:
      reputation: 200
    prerequisites:
      - "speed_upgrade_t1"

  speed_upgrade_t3:
    name: "Racing Engine"
    category: "speed"
    tier: 3
    description: "Increases movement speed by 60%"
    effects:
      - type: "speed_multiplier"
        value: 1.6
    cost:
      reputation: 400
      silver: 25
    prerequisites:
      - "speed_upgrade_t2"

  # Damage upgrades
  damage_upgrade_t1:
    name: "Weapon Calibration"
    category: "damage"
    tier: 1
    description: "Increases weapon damage by 15%"
    effects:
      - type: "damage_multiplier"
        value: 1.15
    cost:
      reputation: 90
    prerequisites: []

  damage_upgrade_t2:
    name: "Precision Targeting"
    category: "damage"
    tier: 2
    description: "Increases weapon damage by 30%"
    effects:
      - type: "damage_multiplier"
        value: 1.3
    cost:
      reputation: 220
    prerequisites:
      - "damage_upgrade_t1"

  damage_upgrade_t3:
    name: "Advanced Munitions"
    category: "damage"
    tier: 3
    description: "Increases weapon damage by 50%"
    effects:
      - type: "damage_multiplier"
        value: 1.5
    cost:
      reputation: 450
      gold: 15
    prerequisites:
      - "damage_upgrade_t2"

# Resistance upgrades
resistance_upgrades:
  physical_resistance_t1:
    name: "Ballistic Protection"
    resistance_type: "physical"
    tier: 1
    description: "Reduces physical damage by 20%"
    effects:
      - type: "resistance_bonus"
        damage_type: "physical"
        value: 0.2
    cost:
      reputation: 120
    prerequisites: []

  physical_resistance_t2:
    name: "Composite Armor"
    resistance_type: "physical"
    tier: 2
    description: "Reduces physical damage by 35%"
    effects:
      - type: "resistance_bonus"
        damage_type: "physical"
        value: 0.35
    cost:
      reputation: 280
    prerequisites:
      - "physical_resistance_t1"

  acid_resistance_t1:
    name: "Corrosion Protection"
    resistance_type: "acid"
    tier: 1
    description: "Reduces acid damage by 25%"
    effects:
      - type: "resistance_bonus"
        damage_type: "acid"
        value: 0.25
    cost:
      reputation: 140
    prerequisites: []

  acid_resistance_t2:
    name: "Acid Neutralizers"
    resistance_type: "acid"
    tier: 2
    description: "Reduces acid damage by 45%"
    effects:
      - type: "resistance_bonus"
        damage_type: "acid"
        value: 0.45
    cost:
      reputation: 320
    prerequisites:
      - "acid_resistance_t1"

  radiation_resistance_t1:
    name: "Radiation Shielding"
    resistance_type: "radiation"
    tier: 1
    description: "Reduces radiation damage by 30%"
    effects:
      - type: "resistance_bonus"
        damage_type: "radiation"
        value: 0.3
    cost:
      reputation: 160
    prerequisites: []

  energy_resistance_t1:
    name: "Energy Dissipators"
    resistance_type: "energy"
    tier: 1
    description: "Reduces energy damage by 20%"
    effects:
      - type: "resistance_bonus"
        damage_type: "energy"
        value: 0.2
    cost:
      reputation: 130
    prerequisites: []

# Base upgrades (floors and facilities)
base_upgrades:
  # Regular floors
  floor_basic:
    name: "Basic Floor"
    type: "floor"
    category: "regular"
    description: "Basic parking and storage floor"
    capacity: 4  # Units that can be stored
    cost:
      reputation: 50
    build_time: 30
    prerequisites: []

  floor_expanded:
    name: "Expanded Floor"
    type: "floor"
    category: "regular"
    description: "Larger parking area for more units"
    capacity: 8
    cost:
      reputation: 150
    build_time: 60
    prerequisites:
      - "floor_basic"

  # Repair floors
  floor_repair_basic:
    name: "Basic Repair Bay"
    type: "floor_repair"
    category: "repair"
    description: "Automated repair facility for damaged units"
    repair_rate: 10  # HP per second
    max_simultaneous_repairs: 2
    cost:
      reputation: 200
    build_time: 90
    prerequisites: []

  floor_repair_advanced:
    name: "Advanced Repair Bay"
    type: "floor_repair"
    category: "repair"
    description: "Faster and more efficient repair facility"
    repair_rate: 20
    max_simultaneous_repairs: 3
    cost:
      reputation: 400
      silver: 20
    build_time: 120
    prerequisites:
      - "floor_repair_basic"

  # Laboratory floors
  floor_lab_biology:
    name: "Biology Laboratory"
    type: "floor_lab_biology"
    category: "laboratory"
    description: "Research facility for biological samples"
    research_speed: 1.0
    specializations:
      - "biology"
    healing_rate: 5  # Cat healing per second
    cost:
      reputation: 300
    build_time: 150
    prerequisites: []

  floor_lab_technology:
    type: "floor_lab_technology"
    category: "laboratory"
    description: "Research facility for technological artifacts"
    research_speed: 1.0
    specializations:
      - "technology"
    crafting_slots: 2
    cost:
      reputation: 300
    build_time: 150
    prerequisites: []

  floor_lab_ecology:
    name: "Ecology Laboratory"
    type: "floor_lab_ecology"
    category: "laboratory"
    description: "Research facility for environmental samples"
    research_speed: 1.0
    specializations:
      - "ecology"
    cost:
      reputation: 300
    build_time: 150
    prerequisites: []

  floor_lab_universal:
    name: "Universal Laboratory"
    type: "floor_lab_universal"
    category: "laboratory"
    description: "Advanced lab capable of all research types"
    research_speed: 1.5
    specializations:
      - "biology"
      - "technology"
      - "ecology"
    crafting_slots: 1
    healing_rate: 3
    cost:
      reputation: 800
      gold: 25
    build_time: 300
    prerequisites:
      - "floor_lab_biology"
      - "floor_lab_technology"
      - "floor_lab_ecology"

  # Rest and recovery
  floor_rest:
    name: "Rest Area"
    type: "floor_rest"
    category: "rest"
    description: "Area for crew recovery and fatigue reduction"
    fatigue_recovery_rate: 0.1  # Fatigue reduction per second
    capacity: 6  # Cats that can rest simultaneously
    cost:
      reputation: 100
    build_time: 45
    prerequisites: []

  # Storage
  floor_storage:
    name: "Storage Facility"
    type: "floor_storage"
    category: "storage"
    description: "Facility for storing collected resources"
    capacity: 1000  # Base resource capacity
    cost:
      reputation: 120
    build_time: 50
    prerequisites: []

# Research and technology tree
research_tree:
  basic_mechanics:
    name: "Basic Mechanics"
    description: "Fundamental understanding of vehicle mechanics"
    category: "technology"
    cost:
      science_technology: 5
    unlocks:
      - "health_upgrade_t1"
      - "speed_upgrade_t1"
      - "damage_upgrade_t1"

  advanced_materials:
    name: "Advanced Materials"
    description: "Research into stronger materials and alloys"
    category: "technology"
    cost:
      science_technology: 15
    prerequisites:
      - "basic_mechanics"
    unlocks:
      - "health_upgrade_t2"
      - "physical_resistance_t1"

  weapon_technology:
    name: "Weapon Technology"
    description: "Advanced weapon systems and munitions"
    category: "technology"
    cost:
      science_technology: 12
    prerequisites:
      - "basic_mechanics"
    unlocks:
      - "damage_upgrade_t2"

  hazard_protection:
    name: "Hazard Protection"
    description: "Protection against environmental hazards"
    category: "ecology"
    cost:
      science_ecology: 10
    unlocks:
      - "acid_resistance_t1"
      - "radiation_resistance_t1"

  energy_systems:
    name: "Energy Systems"
    description: "Advanced energy weapons and shields"
    category: "technology"
    cost:
      science_technology: 20
    prerequisites:
      - "advanced_materials"
    unlocks:
      - "energy_resistance_t1"

  elite_training:
    name: "Elite Training"
    description: "Advanced training techniques for crew"
    category: "biology"
    cost:
      science_biology: 18
    unlocks:
      - "crew_elite_training"

# Special abilities and unlocks
special_unlocks:
  crew_elite_training:
    name: "Elite Crew Training"
    description: "Unlocks elite crew members and training"
    effects:
      - type: "crew_unlock"
        crew_types: ["elite_commander", "elite_sniper"]
      - type: "crew_training_bonus"
        experience_multiplier: 1.5

  advanced_base_construction:
    name: "Advanced Base Construction"
    description: "Allows construction of advanced base facilities"
    effects:
      - type: "facility_unlock"
        facilities: ["floor_lab_universal", "floor_repair_advanced"]

  multiple_bases:
    name: "Multiple Bases"
    description: "Allows construction of additional bases"
    effects:
      - type: "base_limit_increase"
        additional_bases: 2
    cost:
      reputation: 1000
      gold: 50
